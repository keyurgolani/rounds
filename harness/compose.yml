# Account-scope security harness. Shaped like docker-compose.prod.yml: the
# same pocketbase, runner, nginx frontend, and snapshot materializer built
# from this commit, on the private app network and the internal materialize
# network, plus a probe runner that drives the two-account proof.
#
# Run it with the launcher, which sequences the phases and tears the stack
# down afterwards:
#
#   harness/run.sh                     # local, Finch
#   COMPOSE_BIN="docker compose" harness/run.sh   # CI, Docker on ubuntu
#
# Credentials here are obvious non-secret test placeholders. The probe
# runner generates its own per-run account credentials and never uses the
# demo password. No service publishes a host port: everything talks over the
# compose network (the probe container joins it), so two runs with different
# project names never collide on a port. To poke a service while debugging,
# add a `ports:` line or use `compose exec`.

services:
  pocketbase:
    build:
      context: ../pocketbase
    image: ${IMAGE_PREFIX:-rounds-9s1}-pocketbase:test
    # Named volume like prod, so recreating the container with signups
    # disabled keeps the accounts and rows created in the main phase.
    # `compose down -v` (the launcher's teardown) removes it. Phase 3o
    # (ROUNDS-00B-L06) starts PocketBase on pb_data_legacy instead, then
    # back on this one.
    volumes:
      - ${PB_DATA_VOLUME:-pb_data}:/pb/pb_data
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-ops@harness.test}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-harness-admin-pw-123}
      - ROUNDS_DISABLE_SIGNUPS=${ROUNDS_DISABLE_SIGNUPS:-false}
      # On until the signup restart, so the admission phase's demo accounts
      # sign in (run.sh); off after it, as on any install by default.
      - ROUNDS_ENABLE_DEMO=${ROUNDS_ENABLE_DEMO:-false}
      # The runner key, a test placeholder shared with both runners.
      - ROUNDS_ADMISSION_SECRET=${ROUNDS_ADMISSION_SECRET:-harness-admission-key-not-a-secret-0123}
      # The execution job store (ROUNDS-00A-L03), on by default since PR 4,
      # and the worker secret, a test placeholder, which the launcher gives
      # every phase but 4 and 5 and rotates in phase 3g. PocketBase's and
      # the runners' come from separate variables, so the launcher can
      # rotate one before the other.
      - ROUNDS_GATE_EXECUTION_STORE=${ROUNDS_GATE_EXECUTION_STORE:-}
      - ROUNDS_EXECUTION_SECRET=${PB_EXECUTION_SECRET:-}
      # Legacy Artifact Snapshot creation (ROUNDS-00A-L04): the snapshot
      # phases turn it on and off, here and on both runners.
      - ROUNDS_GATE_LEGACY_SNAPSHOT_CREATE=${ROUNDS_GATE_LEGACY_SNAPSHOT_CREATE:-}
      - MATERIALIZER_URL=http://materializer:4100
      # The share resolver's password (ROUNDS-00B-L04), a test placeholder
      # shared with both runners.
      - ROUNDS_SHARE_RESOLVER_PASSWORD=${ROUNDS_SHARE_RESOLVER_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    # As in prod: the app network, plus the internal one only it shares with
    # the materializer.
    networks:
      - default
      - materialize
    restart: "no"

  # The Legacy Artifact Snapshot materializer, built from the repository root
  # and run as docker-compose.prod.yml runs it (ROUNDS-00A-L04). Phase 7b
  # checks that only PocketBase reaches it. It sits behind the `materializer`
  # profile, as the deploy compose files do; run.sh enables the profile so
  # phase 7b still builds and runs it.
  materializer:
    profiles: ["materializer"]
    build:
      context: ..
      dockerfile: backend/materializer/Dockerfile
    image: ${IMAGE_PREFIX:-rounds-9s1}-materializer:test
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    networks:
      - materialize
    restart: "no"

  # The PDF renderer, built from this commit and run as
  # docker-compose.prod.yml runs it: on the app network, where only the
  # runners call it, with no host port (ROUNDS-00A-L04). It sits behind the
  # `renderer` profile, and run.sh starts it only for the snapshot render
  # phases, so every other phase sees a runner with no renderer to reach.
  # TODO(ROUNDS-00A-L06): #6's render workers replace this sidecar.
  pdf-renderer:
    profiles: ["renderer"]
    build:
      context: ../backend/pdf_renderer
    image: ${IMAGE_PREFIX:-rounds-9s1}-pdf-renderer:test
    restart: "no"

  # Shaped like prod: the runner, plus runner-b, a second replica of the same
  # image on the same PocketBase, as k8s/runner.yaml runs two. The launcher
  # starts both for the admission phase (ROUNDS-00A-L01 stage 3), and the
  # runner again with the frontend for the deployment phases
  # (harness/verify_deployment.py and the degraded probe); the account-scope
  # rule probes talk to PocketBase directly.
  runner:
    build:
      context: ../backend
    image: ${IMAGE_PREFIX:-rounds-9s1}-runner:test
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &runner-environment
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # Phase 3o (ROUNDS-00B-L06) points both runners at the recorder.
      - POCKETBASE_URL=${RUNNER_POCKETBASE_URL:-http://pocketbase:8090}
      - AI_KEY_SECRET=${AI_KEY_SECRET:-rounds-dev-key-DO-NOT-USE-IN-PROD}
      # The placeholder above is public, so it counts only where a compose
      # file opts in, as the development and test ones do; elsewhere saved
      # AI provider keys and share links answer that they're unavailable.
      - ROUNDS_ALLOW_DEV_KEY=true
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-ops@harness.test}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-harness-admin-pw-123}
      - ROUNDS_GATE_ENFORCE_IDEMPOTENCY=${ROUNDS_GATE_ENFORCE_IDEMPOTENCY:-}
      - ROUNDS_GATE_ENFORCE_QUOTA=${ROUNDS_GATE_ENFORCE_QUOTA:-}
      # The emergency-disable phase turns /api/run off, then back on
      # (ROUNDS-00A-L01 stage 4).
      - ROUNDS_GATE_RUN=${ROUNDS_GATE_RUN:-}
      - ROUNDS_ADMISSION_SECRET=${ROUNDS_ADMISSION_SECRET:-harness-admission-key-not-a-secret-0123}
      - ROUNDS_GATE_EXECUTION_STORE=${ROUNDS_GATE_EXECUTION_STORE:-}
      - ROUNDS_EXECUTION_SECRET=${RUNNER_EXECUTION_SECRET:-}
      # Both keys are on by default (ROUNDS-00A-L03 PR 4), so with
      # definitions enforced every phase runs code as jobs on server-owned
      # definitions; phases 3e to 3g3 turn one key or both off.
      - ROUNDS_GATE_EXECUTION_SCRATCH=${ROUNDS_GATE_EXECUTION_SCRATCH:-}
      - ROUNDS_GATE_EXECUTION_GRADING=${ROUNDS_GATE_EXECUTION_GRADING:-}
      - ROUNDS_GATE_EXECUTION_DEFINITIONS=${ROUNDS_GATE_EXECUTION_DEFINITIONS:-}
      - ROUNDS_GATE_LEGACY_SNAPSHOT_CREATE=${ROUNDS_GATE_LEGACY_SNAPSHOT_CREATE:-}
      # Every phase runs with the demo's code runs at their default, off
      # (ROUNDS-00B-L07).
      - ROUNDS_GATE_DEMO_EXECUTION=${ROUNDS_GATE_DEMO_EXECUTION:-}
      # The share secrets phases open share capability resolution
      # (ROUNDS-00B-L04).
      - ROUNDS_GATE_SHARE_CAPABILITY_RESOLUTION=${ROUNDS_GATE_SHARE_CAPABILITY_RESOLUTION:-}
      - ROUNDS_SHARE_RESOLVER_PASSWORD=${ROUNDS_SHARE_RESOLVER_PASSWORD:-}
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: "no"

  # The image runner builds; this replica never builds its own.
  runner-b:
    image: ${IMAGE_PREFIX:-rounds-9s1}-runner:test
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *runner-environment
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: "no"

  # Nginx frontend built from this commit, so the deployment verifier tests the
  # real frontend/nginx.conf.
  frontend:
    build:
      context: ../frontend
    image: ${IMAGE_PREFIX:-rounds-9s1}-frontend:test
    depends_on:
      - pocketbase
      - runner
    restart: "no"

  # The recording proxy between the runners and PocketBase (ROUNDS-00B-L05),
  # which phase 3o runs (ROUNDS-00B-L06): one line per call with its auth
  # class, and never a header, token, query, or body. It listens on the
  # stack's network only and publishes no port; its log is on a volume of
  # its own, never the receipts.
  recorder:
    image: ${IMAGE_PREFIX:-rounds-9s1}-probes:test
    entrypoint: ["python", "recorder.py"]
    environment:
      - RECORDER_UPSTREAM=http://pocketbase:8090
      - RECORDER_HOST=0.0.0.0
      - RECORDER_PORT=8090
      - RECORDER_SALT=${RECORDER_SALT:-}
      - RECORDER_LOG=/var/lib/rounds-recorder/recorder.jsonl
    volumes:
      - recorder_log:/var/lib/rounds-recorder
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: "no"

  probes:
    build:
      context: .
      dockerfile: Dockerfile.probes
    image: ${IMAGE_PREFIX:-rounds-9s1}-probes:test
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-ops@harness.test}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-harness-admin-pw-123}
      - POLICY_PATH=/policy/account-scope.v1.json
      - RECEIPTS_PATH=/out/receipts.jsonl
      - PB_MIGRATIONS_DIR=/pb_migrations
      - RUN_ID=${RUN_ID:-local}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - PB_BINARY_SHA256=${PB_BINARY_SHA256:-}
      - PB_BINARY_ARCH=${PB_BINARY_ARCH:-}
    volumes:
      - ../docs/security:/policy:ro
      - ../pocketbase/pb_migrations:/pb_migrations:ro
      - ./.receipts:/out
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: "no"

networks:
  # No route out; only PocketBase and the materializer join it.
  materialize:
    internal: true

volumes:
  pb_data:
  # Both made by the launcher before the stack starts and removed at
  # teardown (ROUNDS-00B-L06): phase 3o's pb_data shaped like 62d4eae, and
  # the recorder's log.
  pb_data_legacy:
    external: true
    name: ${PB_LEGACY_VOLUME:-rounds-9s1_pb_legacy}
  recorder_log:
    external: true
    name: ${RECORDER_VOLUME:-rounds-9s1_recorder}
