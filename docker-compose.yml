services:
  pocketbase:
    build: ./pocketbase
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      # Migration 1700000500_bootstrap_admin.js reads these on fresh
      # setup and creates the first admin. Override in .env for real
      # credentials; defaults are dev-only and obviously placeholder.
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-admin@local.dev}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-changemenowplz}
      # ROUNDS_GATE_SIGNUPS wins when set; ROUNDS_DISABLE_SIGNUPS is
      # its alias here.
      - ROUNDS_GATE_SIGNUPS=${ROUNDS_GATE_SIGNUPS:-}
      - ROUNDS_DISABLE_SIGNUPS=${ROUNDS_DISABLE_SIGNUPS:-false}
      # The key the runner sends with each admission store write; the
      # runner gets the same value. The default is dev-only.
      - ROUNDS_ADMISSION_SECRET=${ROUNDS_ADMISSION_SECRET:-rounds-dev-admission-key-DO-NOT-USE-IN-PROD}
    # The app network, plus the internal one only it shares with the
    # materializer.
    networks:
      - default
      - materialize
    restart: unless-stopped

  # Legacy Artifact Snapshot materializer (ROUNDS-00A-L04). It builds from
  # the repository root because it bundles the resume templates. Only
  # PocketBase reaches it, over the internal materialize network; it has no
  # host port, no secret, no other network, and a read-only filesystem.
  # Nothing calls it yet.
  materializer:
    build:
      context: .
      dockerfile: backend/materializer/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - materialize
    restart: unless-stopped

  runner:
    build: ./backend
    # Override the image CMD for dev so we get hot reload on source edits.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${RUNNER_PORT:-3099}:8000"
    volumes:
      # Read-only, so candidate code can't write the runner's source
      # (backend/app/sandbox.py); --reload only reads.
      - ./backend:/app:ro
    environment:
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - PDF_RENDERER_URL=${PDF_RENDERER_URL:-http://pdf-renderer:4000}
      - POCKETBASE_URL=${POCKETBASE_INTERNAL_URL:-http://pocketbase:8090}
      - AI_KEY_SECRET=${AI_KEY_SECRET:-rounds-dev-key-DO-NOT-USE-IN-PROD}
      # Used by the public-share endpoint to bypass PB owner rules
      # via a cached admin token. Defaults match the bootstrap admin.
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-admin@local.dev}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-changemenowplz}
      # Same value as PocketBase's; candidate processes never get it.
      - ROUNDS_ADMISSION_SECRET=${ROUNDS_ADMISSION_SECRET:-rounds-dev-admission-key-DO-NOT-USE-IN-PROD}
      # Gates (docs/configuration.md#gates). Empty keeps each written
      # default, and the runner logs every value at startup.
      - ROUNDS_GATE_RUN=${ROUNDS_GATE_RUN:-}
      - ROUNDS_GATE_EVALUATE=${ROUNDS_GATE_EVALUATE:-}
      - ROUNDS_GATE_AI_CODING_RUN_PROJECT=${ROUNDS_GATE_AI_CODING_RUN_PROJECT:-}
      - ROUNDS_GATE_AI_CODING_GRADE=${ROUNDS_GATE_AI_CODING_GRADE:-}
      - ROUNDS_GATE_TAKE_HOME_RUN=${ROUNDS_GATE_TAKE_HOME_RUN:-}
      - ROUNDS_GATE_TAKE_HOME_SUBMIT=${ROUNDS_GATE_TAKE_HOME_SUBMIT:-}
      - ROUNDS_GATE_PDF_RENDER=${ROUNDS_GATE_PDF_RENDER:-}
      - ROUNDS_GATE_PDF_HEALTH=${ROUNDS_GATE_PDF_HEALTH:-}
      - ROUNDS_GATE_ATS_RULE=${ROUNDS_GATE_ATS_RULE:-}
      - ROUNDS_GATE_PAPER_FETCH=${ROUNDS_GATE_PAPER_FETCH:-}
      - ROUNDS_GATE_PROVIDER_PRIVATE_NETWORK=${ROUNDS_GATE_PROVIDER_PRIVATE_NETWORK:-}
      - ROUNDS_GATE_ENFORCE_IDEMPOTENCY=${ROUNDS_GATE_ENFORCE_IDEMPOTENCY:-}
      - ROUNDS_GATE_ENFORCE_QUOTA=${ROUNDS_GATE_ENFORCE_QUOTA:-}
      - ROUNDS_GATE_EXECUTION_DEFINITIONS=${ROUNDS_GATE_EXECUTION_DEFINITIONS:-}
    depends_on:
      - pdf-renderer
      - pocketbase
    restart: unless-stopped

  pdf-renderer:
    build: ./backend/pdf_renderer
    # Internal-only — the runner forwards /api/pdf/render here. No host
    # port mapping; access from the host is via the runner.
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Same-origin /api/* is proxied to the backend service via
      # frontend/devProxy.ts. Override VITE_API_PROXY_TARGET only when
      # pointing the dev server at a backend on a different host.
      # Runner is reached through the /api/run etc. proxy; PB via /api/*.
      - VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET:-http://runner:8000}
      - VITE_POCKETBASE_PROXY_TARGET=${VITE_POCKETBASE_PROXY_TARGET:-http://pocketbase:8090}
      # Leave VITE_POCKETBASE_URL empty so the browser uses same-origin
      # — works from the host *and* from any device on the LAN.
      - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-}
      - VITE_OAUTH_GOOGLE_ENABLED=${VITE_OAUTH_GOOGLE_ENABLED:-false}
      - VITE_OAUTH_GITHUB_ENABLED=${VITE_OAUTH_GITHUB_ENABLED:-false}
      - VITE_DISABLE_SIGNUPS=${VITE_DISABLE_SIGNUPS:-false}
      # Vite exposes ROUNDS_GATE_* to the dev SPA (vite.config.ts).
      - ROUNDS_GATE_SIGNUPS=${ROUNDS_GATE_SIGNUPS:-}
      # The SPA's request shapes follow the runner's (ROUNDS-00A-L02).
      - ROUNDS_GATE_EXECUTION_DEFINITIONS=${ROUNDS_GATE_EXECUTION_DEFINITIONS:-}
    depends_on:
      - runner
      - pocketbase
    restart: unless-stopped

networks:
  # No route out; only PocketBase and the materializer join it.
  materialize:
    internal: true

volumes:
  pb_data:
