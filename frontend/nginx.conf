server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Runner endpoints (exact match wins over the /api/ prefix) ---
    location = /api/run      { proxy_pass http://runner:8000; }
    location = /api/evaluate { proxy_pass http://runner:8000; }
    location = /api/execute  { proxy_pass http://runner:8000; }

    # Other runner-owned API groups. Without these the /api/ prefix
    # below would catch them and forward to PocketBase, which returns
    # a 404 in PocketBase's error shape. /api/ai streams SSE, so we
    # disable proxy buffering for the whole group — harmless for the
    # non-streaming /api/share and /api/pdf endpoints.
    location ~ ^/api/(share|pdf|ai|ai-coding|take-home)(/|$) {
        proxy_pass         http://runner:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering    off;
    }

    # --- PocketBase REST + realtime + admin UI ---
    # Everything else under /api/ and all of /_/ go to PocketBase. The
    # SDK uses a same-origin base URL so no prefix rewriting is needed.
    location /api/ {
        proxy_pass         http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600;
    }

    location /_/ {
        proxy_pass         http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed assets from Vite's build output.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # .mjs assets (e.g. the pdfjs-dist worker) must be served with a
    # JavaScript Content-Type or browsers refuse to load them as ES
    # modules. nginx:1.27-alpine's default mime.types maps .js but not
    # .mjs, so without this they fall through to application/octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
