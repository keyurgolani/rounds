server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Request bodies over a location's cap stop here with a typed 413.
    # The runner caps each admitted route again (backend/app/admission.py).
    client_max_body_size 1m;
    error_page 413 = @payload_too_large;

    # --- Runner endpoints (exact match wins over the /api/ prefix) ---
    # Each waits as long as the longest request the runner admits there,
    # plus a margin: a run is admitted for 3 s, an evaluate for 320 s
    # (32 cases of 10 s), each with a 30 s grace (backend/app/admission.py).
    location = /api/run {
        client_max_body_size 512k;
        proxy_read_timeout 60s;
        proxy_pass http://runner:8000;
    }
    location = /api/evaluate {
        client_max_body_size 512k;
        proxy_read_timeout 420s;
        proxy_pass http://runner:8000;
    }

    # Other runner-owned API groups. Without these the /api/ prefix
    # below would catch them and forward to PocketBase, which returns
    # a 404 in PocketBase's error shape. /api/ai streams SSE, so we
    # disable proxy buffering for the whole group — harmless for the
    # non-streaming /api/share and /api/pdf endpoints. Project runs,
    # grades, and take-home submissions carry up to 5 MiB of files.
    # /api/execution reads and cancels the account's own jobs; a read
    # waits up to 20 s for its job to change (ROUNDS-00A-L03).
    location ~ ^/api/(share|pdf|ai|ai-coding|sd-practice|take-home|execution)(/|$) {
        client_max_body_size 6m;
        proxy_pass         http://runner:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering    off;
    }

    # --- Never proxied (ROUNDS-00A-L01) ---
    # PocketBase's admin UI and admin APIs, its collection schema routes,
    # the admission and execution hook routes, the execution service
    # record's routes, its login included (ROUNDS-00A-L03), the legacy
    # snapshot hook (ROUNDS-00A-L04), and the share capability hooks
    # (ROUNDS-00B-L03), both of which only the runner calls, stay
    # unreachable from outside. The collection locations and the two hook
    # locations match in any case (~*). A collection segment outside the
    # name alphabet, which no collection name or id uses, is refused too.
    # The Vite dev proxy denies the same paths (devProxy.ts).
    location ^~ /_/ { return 404; }
    location ^~ /api/rounds/admission/ { return 404; }
    location ^~ /api/rounds/execution/ { return 404; }
    location ~* ^/api/rounds/legacy-snapshots { return 404; }
    location ~* ^/api/rounds/share { return 404; }
    location ~ ^/api/(admins|settings|backups|logs)(/|$) { return 404; }
    location ~* ^/api/collections/execution_service/ { return 404; }
    location ~ ^/api/collections/[^/]*[^A-Za-z0-9_/][^/]*(/|$) { return 404; }
    location ~* ^/api/collections(/[^/]+)?/?$ { return 404; }

    # --- PocketBase REST + realtime ---
    # Everything else under /api/ goes to PocketBase. The SDK uses a
    # same-origin base URL so no prefix rewriting is needed.
    location /api/ {
        proxy_pass         http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600;
    }

    # The runner's typed envelope (admission/v1), with nginx's request id
    # as the correlation id.
    location @payload_too_large {
        default_type application/json;
        add_header X-Correlation-Id $request_id always;
        return 413 '{"detail":"The request is larger than this route accepts.","code":"payload_too_large","correlation_id":"$request_id"}';
    }

    # Long-cache hashed assets from Vite's build output.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # .mjs assets (e.g. the pdfjs-dist worker) must be served with a
    # JavaScript Content-Type or browsers refuse to load them as ES
    # modules. nginx:1.27-alpine's default mime.types maps .js but not
    # .mjs, so without this they fall through to application/octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Public share pages (ROUNDS-00B-L03) ---
    # The share pages serve the app page with headers that keep it out of
    # caches, search indexes, referrers, and frames, and a CSP that runs only
    # this origin's scripts. The last block catches the same paths in any
    # letter case (the app answers only the lowercase path; see App.tsx).
    # try_files serves index.html in place, so the SPA fallback below can't
    # drop these headers. The runner sets the same headers, with its own CSP,
    # on its public share answers (backend/app/share_capabilities.py). The
    # share page shows a capability's markup in a sandboxed srcdoc frame,
    # which inherits this CSP. The Google Fonts
    # origins go when ROUNDS-33-L02 stops loading them from index.html.
    location = /r {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }
    location ^~ /r/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }
    location ~* ^/r(/|$) {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
