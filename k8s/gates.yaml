# Gates (docs/configuration.md#gates). The runner, PocketBase, and the
# frontend read this ConfigMap through `envFrom`, and each one reads
# only its own gates. A process reads its gates once at startup and
# logs every value, so restart each Deployment that reads a changed
# gate, for example:
#
#   kubectl -n rounds rollout restart deployment/runner
#
# An empty value keeps the written default, which is today's behavior.
# A value outside a gate's list takes its most restrictive value and
# logs an error. Gate values aren't secret, so never put a secret here.
#
# Leave ROUNDS_GATE_SIGNUPS empty to keep `ROUNDS_DISABLE_SIGNUPS` in
# pocketbase.yaml in charge. Set it to "disabled" to close signups in
# PocketBase and hide the form in the frontend in one place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rounds-gates
  namespace: rounds
data:
  # Runner routes: "enabled" or "disabled". A disabled route answers
  # 503 `route_disabled`.
  ROUNDS_GATE_RUN: ""
  ROUNDS_GATE_EVALUATE: ""
  ROUNDS_GATE_AI_CODING_RUN_PROJECT: ""
  ROUNDS_GATE_AI_CODING_GRADE: ""
  ROUNDS_GATE_TAKE_HOME_RUN: ""
  ROUNDS_GATE_TAKE_HOME_SUBMIT: ""
  ROUNDS_GATE_PDF_RENDER: ""
  ROUNDS_GATE_PDF_HEALTH: ""
  ROUNDS_GATE_ATS_RULE: ""
  # The paper_url fetch in /api/ai/improve: "enabled" or "disabled".
  ROUNDS_GATE_PAPER_FETCH: ""
  # AI provider base URLs on private addresses: "enabled" or "disabled".
  ROUNDS_GATE_PROVIDER_PRIVATE_NETWORK: ""
  # Runner admission steps 6 and 7: "off", "observe", or "enforce".
  # Empty is "observe", which logs what enforcing would deny and denies
  # nothing.
  ROUNDS_GATE_ENFORCE_IDEMPOTENCY: ""
  ROUNDS_GATE_ENFORCE_QUOTA: ""
  # Where the six execution routes get what they run: "legacy",
  # "enforce", or "disabled". The runner and the frontend both read it,
  # so restart both Deployments when it changes. Code runs need
  # "enforce": at any other value the execution keys act as "off".
  ROUNDS_GATE_EXECUTION_DEFINITIONS: ""
  # The execution job store, read by PocketBase and the runner: "on" (the
  # default) or "off", its emergency stop. On, PocketBase serves the
  # store's hook routes and each runner runs its worker. It needs
  # ROUNDS_EXECUTION_SECRET in both (runner.yaml, step 4).
  ROUNDS_GATE_EXECUTION_STORE: ""
  # Run, evaluate, run-project, and take-home run, read by the runner:
  # "on" (the default, as durable jobs) or "off" (503 execution_disabled,
  # drafts kept); "legacy" acts as "off", and no value runs code in its
  # request. "on" needs ROUNDS_GATE_EXECUTION_STORE "on",
  # ROUNDS_GATE_EXECUTION_DEFINITIONS "enforce", ROUNDS_EXECUTION_SECRET,
  # and ROUNDS_ADMISSION_SECRET; without any of them it acts as "off" and
  # the runner's start log names what it needs.
  ROUNDS_GATE_EXECUTION_SCRATCH: ""
  # Grade, take-home submit, and their rubric reviews, read by the runner:
  # "on" (the default, as durable jobs whose graded row the server writes,
  # each reviewed at most once) or "off" (503 execution_disabled, drafts
  # kept); "legacy" acts as "off", and no value grades in the request.
  # "on" needs what the line above needs and acts as "off" without it.
  ROUNDS_GATE_EXECUTION_GRADING: ""
  # Legacy Artifact Snapshot creation, read by the runner and PocketBase:
  # "enabled" or "disabled". Empty is "disabled". Turn it on only with
  # the materializer applied (k8s/overlays/materializer) and after the
  # signed scan (docs/operations.md#legacy-artifact-snapshots), then
  # restart both Deployments.
  ROUNDS_GATE_LEGACY_SNAPSHOT_CREATE: ""
  # Public share reads, read by the runner: "enabled" or "disabled".
  # Disabled answers every share resolve with the uniform not-found.
  # Empty leaves ROUNDS_DISABLE_PUBLIC_SHARES in charge, which keeps reads
  # on unless it's set to anything but false, 0, no, or off.
  ROUNDS_GATE_PUBLIC_SHARES: ""
  # Share capability resolution, read by the runner and the frontend:
  # "enabled" or "disabled". Empty is "disabled": no share link resolves and
  # nobody can make one until the owner sets it "enabled" (ROUNDS-00B-L06).
  ROUNDS_GATE_SHARE_CAPABILITY_RESOLUTION: ""
  # Signups, read by PocketBase and the frontend: "enabled" or "disabled".
  ROUNDS_GATE_SIGNUPS: ""
  # The demo account, read by PocketBase: "enabled" or "disabled". Empty
  # leaves ROUNDS_ENABLE_DEMO in pocketbase.yaml in charge, which keeps it
  # off.
  ROUNDS_GATE_DEMO: ""
  # The demo account's code runs, read by the runner: "enabled" or
  # "disabled". Empty is "disabled": a demo account's run, evaluate,
  # run-project, grade, take-home run, and take-home submit answer 503
  # demo_execution_disabled. Restart the runner after a change.
  ROUNDS_GATE_DEMO_EXECUTION: ""
