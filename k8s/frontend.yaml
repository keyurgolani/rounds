---
# Frontend nginx container. Two replicas behind the Service — scale
# horizontally. Static SPA + reverse-proxy to the cluster-internal
# PocketBase and runner Services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rounds
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/rounds-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rounds
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
