---
# Frontend nginx container. Two replicas behind the Service — scale
# horizontally. Static SPA + reverse-proxy to the cluster-internal
# PocketBase and runner Services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rounds
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Nothing here calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/your-org/rounds-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            # The whole ConfigMap loads here, but runtime-config.js
            # publishes only the gates the SPA reads.
            - configMapRef:
                name: rounds-gates
                optional: true
          # Behind the ingress controller, nginx sees the controller's pod
          # as every request's peer. Set ROUNDS_FRONTEND_REAL_IP_FROM to the
          # controller's pod CIDR (comma-separated for more than one), and
          # nginx takes each client's address from X-Forwarded-For past it
          # (docker-entrypoint.d/20-real-ip.sh). Unset, every client shares
          # one address for the share resolver's backstop and throttle.
          # env:
          #   - name: ROUNDS_FRONTEND_REAL_IP_FROM
          #     value: "10.42.0.0/16"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rounds
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
