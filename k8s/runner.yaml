---
# Code runner — stateless, safe to scale horizontally. Each pod
# subprocess-executes user code in-process, so RAM and CPU limits
# matter more than request handling concurrency.
#
# Required configuration BEFORE applying this file:
#
#   1. Create the secret with AI key + PB admin creds (one-time):
#
#      kubectl -n rounds create secret generic rounds-runner-secrets \
#        --from-literal=AI_KEY_SECRET="$(openssl rand -hex 32)" \
#        --from-literal=PB_ADMIN_EMAIL="ops@example.com" \
#        --from-literal=PB_ADMIN_PASSWORD="$(openssl rand -base64 32)"
#
#   2. (Optional) edit CORS_ALLOW_ORIGINS below if the app is reached
#      from cross-origin domains.
#
# The runner refuses to start when AI_KEY_SECRET is unset or matches
# the dev placeholder, so a misconfigured rollout fails closed (the
# pod will CrashLoopBackOff with a clear stderr message instead of
# silently encrypting user keys with a public secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: rounds
  labels:
    app: runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
  template:
    metadata:
      labels:
        app: runner
    spec:
      containers:
        - name: runner
          image: ghcr.io/your-org/rounds-runner:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            # Non-secret service plumbing — internal cluster DNS.
            - name: POCKETBASE_URL
              value: "http://pocketbase:8090"
            - name: PDF_RENDERER_URL
              value: "http://pdf-renderer:4000"
            - name: CORS_ALLOW_ORIGINS
              value: ""
          envFrom:
            # AI_KEY_SECRET, PB_ADMIN_EMAIL, PB_ADMIN_PASSWORD live here.
            # See the comment block at the top of this file for how
            # to provision the secret on first deploy.
            - secretRef:
                name: rounds-runner-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: rounds
spec:
  selector:
    app: runner
  ports:
    - name: http
      port: 8000
      targetPort: 8000
