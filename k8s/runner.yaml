---
# Code runner — stateless, safe to scale horizontally. Each pod
# subprocess-executes user code in-process, so RAM and CPU limits
# matter more than request handling concurrency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: rounds
  labels:
    app: runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
  template:
    metadata:
      labels:
        app: runner
    spec:
      containers:
        - name: runner
          image: ghcr.io/your-org/rounds-runner:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CORS_ALLOW_ORIGINS
              value: ""
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: rounds
spec:
  selector:
    app: runner
  ports:
    - name: http
      port: 8000
      targetPort: 8000
