apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rounds

resources:
  - namespace.yaml
  - gates.yaml
  - pocketbase.yaml
  - runner.yaml
  - frontend.yaml
  - ingress.yaml
# The Legacy Artifact Snapshot materializer (ROUNDS-00A-L04) is opt-in and
# not in these resources: PocketBase calls it only while
# ROUNDS_GATE_LEGACY_SNAPSHOT_CREATE is enabled (empty in gates.yaml means
# disabled), so a cluster with the gate off runs no pod whose image a
# release may not carry. To turn snapshot creation on, apply
# k8s/overlays/materializer, which is this base plus the materializer
# (docs/operations.md#legacy-artifact-snapshots).

# The image tag every Deployment runs, in one place: the k8s counterpart of
# ROUNDS_IMAGE_TAG. Pin newTag to a release and set newName to your
# registry's image (for example ghcr.io/keyurgolani/rounds-runner). Upgrade
# or roll back by changing newTag; see docs/operations.md#upgrades.
images:
  - name: ghcr.io/your-org/rounds-frontend
    newTag: "1.0.0"
  - name: ghcr.io/your-org/rounds-pocketbase
    newTag: "1.0.0"
  - name: ghcr.io/your-org/rounds-runner
    newTag: "1.0.0"
