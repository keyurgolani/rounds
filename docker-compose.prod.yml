# Single-box production deploy. Five containers on a private network, and
# an internal one only PocketBase and the snapshot materializer share; only
# the nginx-fronted frontend's port 80 is exposed. By default this
# file pulls published Docker Hub images. Set ROUNDS_IMAGE_TAG or the
# per-service image variables below to pin a release or use GHCR.
#
#   PB_ADMIN_EMAIL=ops@example.com PB_ADMIN_PASSWORD=<strong-password> \
#     AI_KEY_SECRET=<random-32-byte-hex> \
#     docker compose -f docker-compose.prod.yml up -d
#
# REQUIRED env vars (no defaults — `${VAR:-}` will leave them blank and
# the runner will refuse to start):
#
#   AI_KEY_SECRET        — 32+ byte secret used to AES-GCM-wrap user AI
#                          provider keys at rest. Generate once with
#                          `openssl rand -hex 32` and never rotate
#                          without re-encrypting the ai_providers rows.
#   PB_ADMIN_EMAIL       — first PocketBase admin (created by migration
#                          1700000500_bootstrap_admin.js on fresh
#                          setup; also used by the share router to mint
#                          a cached admin token for public viewer reads).
#   PB_ADMIN_PASSWORD    — password for the above.
#
# OPTIONAL env vars:
#
#   CORS_ALLOW_ORIGINS   — comma-separated origins for the runner's
#                          CORS header. Empty => same-origin only.
#   ROUNDS_GATE_SIGNUPS  - "disabled" stops PB-side signup creation and
#                          hides the signup form. ROUNDS_DISABLE_SIGNUPS
#                          (PocketBase) and VITE_DISABLE_SIGNUPS (frontend)
#                          still work as aliases when it is unset.
#   ROUNDS_GATE_*        - the other gates in docs/configuration.md.
#                          Unset keeps each written default.
#   ROUNDS_ADMISSION_SECRET - 32+ characters, the same on PocketBase and
#                          the runner (`openssl rand -hex 32`). The runner
#                          sends it with each admission store write; set
#                          it before ROUNDS_GATE_ENFORCE_* is `enforce`.
#
# If admin creds are unset, no admin is bootstrapped and you must run:
#
#   docker exec -it <pocketbase-container> /pb/pocketbase admin \
#       create admin@example.com <password>

services:
  pocketbase:
    image: ${ROUNDS_POCKETBASE_IMAGE:-keyurgolani/rounds-pocketbase:${ROUNDS_IMAGE_TAG:-latest}}
    volumes:
      - pb_data:/pb/pb_data
    environment:
      # No defaults in prod — set these explicitly in the deploy
      # environment or skip admin bootstrap.
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - ROUNDS_GATE_SIGNUPS=${ROUNDS_GATE_SIGNUPS:-}
      - ROUNDS_DISABLE_SIGNUPS=${ROUNDS_DISABLE_SIGNUPS:-false}
      # Blank, the admission store's write routes answer 503.
      - ROUNDS_ADMISSION_SECRET=${ROUNDS_ADMISSION_SECRET:-}
    # The private app network, plus the internal one only it shares with
    # the materializer.
    networks:
      - default
      - materialize
    restart: unless-stopped

  # Legacy Artifact Snapshot materializer (ROUNDS-00A-L04). Only PocketBase
  # reaches it, over the internal materialize network; it has no host port,
  # no secret, no other network, and a read-only filesystem.
  materializer:
    image: ${ROUNDS_MATERIALIZER_IMAGE:-keyurgolani/rounds-materializer:${ROUNDS_IMAGE_TAG:-latest}}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    networks:
      - materialize
    restart: unless-stopped

  pdf-renderer:
    image: ${ROUNDS_PDF_RENDERER_IMAGE:-keyurgolani/rounds-pdf-renderer:${ROUNDS_IMAGE_TAG:-latest}}
    # Internal-only — only the runner reaches it via the docker network.
    # No host port mapping.
    restart: unless-stopped

  runner:
    image: ${ROUNDS_RUNNER_IMAGE:-keyurgolani/rounds-runner:${ROUNDS_IMAGE_TAG:-latest}}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # Internal service URLs — match the docker-compose service names.
      - POCKETBASE_URL=${POCKETBASE_INTERNAL_URL:-http://pocketbase:8090}
      - PDF_RENDERER_URL=${PDF_RENDERER_URL:-http://pdf-renderer:4000}
      # Required: AES-GCM key for ai_providers.encrypted_key. Empty here
      # so a misconfigured deploy fails closed (the runner refuses to
      # start when AI_KEY_SECRET is unset in any non-dev environment).
      - AI_KEY_SECRET=${AI_KEY_SECRET:-}
      # Reused for the share router's cached admin token. Defaulting
      # blank means public-share viewing will 502 until creds are set —
      # that's the right failure mode (loud) vs. silent admin login
      # against the dev placeholder credentials.
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      # Same value as PocketBase's. Blank, admission logs
      # quota_unavailable in observe mode and denies with it in enforce.
      - ROUNDS_ADMISSION_SECRET=${ROUNDS_ADMISSION_SECRET:-}
      # Gates (docs/configuration.md#gates). Empty keeps each written
      # default, and the runner logs every value at startup.
      - ROUNDS_GATE_RUN=${ROUNDS_GATE_RUN:-}
      - ROUNDS_GATE_EVALUATE=${ROUNDS_GATE_EVALUATE:-}
      - ROUNDS_GATE_AI_CODING_RUN_PROJECT=${ROUNDS_GATE_AI_CODING_RUN_PROJECT:-}
      - ROUNDS_GATE_AI_CODING_GRADE=${ROUNDS_GATE_AI_CODING_GRADE:-}
      - ROUNDS_GATE_TAKE_HOME_RUN=${ROUNDS_GATE_TAKE_HOME_RUN:-}
      - ROUNDS_GATE_TAKE_HOME_SUBMIT=${ROUNDS_GATE_TAKE_HOME_SUBMIT:-}
      - ROUNDS_GATE_PDF_RENDER=${ROUNDS_GATE_PDF_RENDER:-}
      - ROUNDS_GATE_PDF_HEALTH=${ROUNDS_GATE_PDF_HEALTH:-}
      - ROUNDS_GATE_ATS_RULE=${ROUNDS_GATE_ATS_RULE:-}
      - ROUNDS_GATE_PAPER_FETCH=${ROUNDS_GATE_PAPER_FETCH:-}
      - ROUNDS_GATE_PROVIDER_PRIVATE_NETWORK=${ROUNDS_GATE_PROVIDER_PRIVATE_NETWORK:-}
      - ROUNDS_GATE_ENFORCE_IDEMPOTENCY=${ROUNDS_GATE_ENFORCE_IDEMPOTENCY:-}
      - ROUNDS_GATE_ENFORCE_QUOTA=${ROUNDS_GATE_ENFORCE_QUOTA:-}
      - ROUNDS_GATE_EXECUTION_DEFINITIONS=${ROUNDS_GATE_EXECUTION_DEFINITIONS:-}
    depends_on:
      - pocketbase
      - pdf-renderer
    restart: unless-stopped

  frontend:
    image: ${ROUNDS_FRONTEND_IMAGE:-keyurgolani/rounds-frontend:${ROUNDS_IMAGE_TAG:-latest}}
    environment:
      - VITE_DISABLE_SIGNUPS=${VITE_DISABLE_SIGNUPS:-false}
      - VITE_OAUTH_GOOGLE_ENABLED=${VITE_OAUTH_GOOGLE_ENABLED:-false}
      - VITE_OAUTH_GITHUB_ENABLED=${VITE_OAUTH_GITHUB_ENABLED:-false}
      # runtime-config.js publishes only the gates the SPA reads.
      - ROUNDS_GATE_SIGNUPS=${ROUNDS_GATE_SIGNUPS:-}
      # The SPA's request shapes follow the runner's (ROUNDS-00A-L02).
      - ROUNDS_GATE_EXECUTION_DEFINITIONS=${ROUNDS_GATE_EXECUTION_DEFINITIONS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - pocketbase
      - runner
    restart: unless-stopped

networks:
  # No route out; only PocketBase and the materializer join it.
  materialize:
    internal: true

volumes:
  pb_data:
