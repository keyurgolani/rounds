name: CI

on:
  pull_request:
  push:
    # next runs the same checks after each merge; no job here publishes.
    branches: [main, next]

# CI only reads the checkout and runs tests; keep it read-only regardless of
# the repository's default workflow permissions.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Take-home assignments include TS harnesses invoked via
      # `node --experimental-strip-types harness/run.ts` (added in
      # Node 22.6). Without this step the runner falls back to the
      # ubuntu-latest system Node (18) which doesn't know the flag,
      # and test_take_home_integration::event-bus-ts fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tsx is the TS loader used by AI Coding rounds' test commands
      # (e.g., `tsx --test tests/checkpoint_0/foo.test.ts`). Mirrors
      # what the runner Dockerfile installs globally.
      - run: npm install -g tsx@4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest . ../pocketbase/tests

  pdf-renderer:
    # PDF sidecar containment (ROUNDS-00A-L01). Builds the renderer image
    # from this commit and runs server.test.mjs inside it, against the
    # image's own Chromium: a render answers a PDF and leaves no page open,
    # and a document that opens a window or loads a URL reaches nothing on
    # the network and leaves no page behind. Docker on ubuntu; locally use
    # Finch (finch build; finch run ... node --test server.test.mjs).
    # TODO(ROUNDS-00A-L06): #6's render workers replace this sidecar.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the renderer image
        run: docker build -t rounds-pdf-renderer:test backend/pdf_renderer
      - name: Containment tests in the image
        run: |
          docker run --rm \
            -v "$PWD/backend/pdf_renderer/server.test.mjs:/app/server.test.mjs:ro" \
            rounds-pdf-renderer:test node --test server.test.mjs

  materializer:
    # Legacy Artifact Snapshot materializer (ROUNDS-00A-L04). Builds the
    # image from the repository root through its Dockerfile.dockerignore and
    # runs the tests inside it, offline, read-only, and as its own user:
    # every template twice to the same bytes, each bad input to the same
    # reason, the output checks, the tests/conformance/rd_02 sub-cases, and
    # the HTTP surface. Locally use Finch (finch build -f
    # backend/materializer/Dockerfile .; finch run ... node --test).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the materializer image
        run: docker build -f backend/materializer/Dockerfile -t rounds-materializer:test .
      - name: Tests in the image
        run: |
          docker run --rm --network none --read-only \
            -v "$PWD/backend/materializer/test:/app/test:ro" \
            -v "$PWD/tests/conformance/rd_02:/tests/conformance/rd_02:ro" \
            rounds-materializer:test node --test 'test/*.test.mjs'

  conformance:
    # Repository conformance rules (ROUNDS-01-L01, ROUNDS-01-L02): the
    # product vocabulary registry and its coverage of baseline names, the
    # source-of-truth and package-boundary matrix and its coverage of the
    # audited revision's stores, decision records, and generated-file drift.
    # Node 22 built-ins only, so there is no install step. Revision checks
    # compare with the branch a pull request targets (main for pushes), and
    # the authority rule reads the audited revision, so the full fetch keeps
    # both histories. Fix drift with `node scripts/conformance/run.mjs --write`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rule tests
        run: node --test scripts/conformance
      - name: Conformance
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node scripts/conformance/run.mjs --base "origin/${BASE_REF}"

  harness:
    # Two-account account-scope security harness (ROUNDS-00B-L01). Builds the
    # pocketbase, probe, runner, and nginx frontend images from this commit,
    # creates two accounts with generated credentials, and proves that one
    # account cannot read, list, update, or delete another's records, create a
    # row owned by another account, or move a row to another account; that an
    # account's own updates still succeed; that anonymous writes and oversized
    # JSON are rejected; and that the signup-disabled hook holds. Then runs the
    # deployment verifier (harness/verify_deployment.py) through the real nginx
    # config, the degraded-runner probe, and the read-only cross-owner scan,
    # failing on any missing or failed result. Docker on ubuntu; locally use
    # Finch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run two-account harness
        run: COMPOSE_BIN="docker compose" harness/run.sh
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-scope-receipts
          path: harness/.receipts/
          if-no-files-found: warn

  migrations:
    # Migration safety (ROUNDS-00A-L01 stage 5). PocketBase runs each
    # migration file once, so a pull request into main or next may only add
    # migrations, and a new one may not drop a collection or field or rewrite
    # existing rows outside its down step, unless a reviewed entry in
    # scripts/migration-lint-allowlist.json covers it.
    # TODO(ROUNDS-32-L02): #156's migration framework replaces this lint.
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'next')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The checkout is the pull request merged into its base, so the first
      # parent is the base and the diff is exactly what merging would change.
      - name: Lint migration changes
        run: python scripts/lint_migrations.py --base HEAD^1 --head HEAD

  definitions:
    # Compiled server-owned definitions only grow (ROUNDS-00A-L02). On a
    # pull request into main or next, a change to backend/definitions/ may
    # only add versions and move a lifecycle forward; a shipped version
    # keeps its path, checksum, and bytes. The build and bindings drift
    # checks run in the backend suite (build.py --check and
    # definitions_bindings.py --check through pytest).
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'next')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The checkout is the pull request merged into its base, so the first
      # parent is the base and the diff is exactly what merging would change.
      - name: Check the definitions manifest
        run: python scripts/definitions_manifest_check.py --base HEAD^1 --head HEAD

  migration-check:
    # Behavioural checks for the account-scope rule migration (ROUNDS-00B-L01).
    # Builds the pocketbase image from this commit and runs one-off
    # `pocketbase migrate up` containers to prove the migration applies the
    # policy's rules, that a missing collection fails the whole migration and
    # changes nothing, and that the emergency lever locks a collection and the
    # forward fix restores it. Docker on ubuntu; locally use Finch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run migration check
        run: CONTAINER_BIN=docker harness/migration_check.sh
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-scope-migration-receipts
          path: harness/.receipts/
          if-no-files-found: warn
