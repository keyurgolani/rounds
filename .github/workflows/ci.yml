name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the checkout and runs tests; keep it read-only regardless of
# the repository's default workflow permissions.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Take-home assignments include TS harnesses invoked via
      # `node --experimental-strip-types harness/run.ts` (added in
      # Node 22.6). Without this step the runner falls back to the
      # ubuntu-latest system Node (18) which doesn't know the flag,
      # and test_take_home_integration::event-bus-ts fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tsx is the TS loader used by AI Coding rounds' test commands
      # (e.g., `tsx --test tests/checkpoint_0/foo.test.ts`). Mirrors
      # what the runner Dockerfile installs globally.
      - run: npm install -g tsx@4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest . ../pocketbase/tests

  harness:
    # Two-account account-scope security harness (ROUNDS-00B-L01). Builds the
    # pocketbase and probe images from this commit, creates two accounts with
    # generated credentials, and proves that one account cannot read, list, or
    # delete another's records (plus the signup-disabled hook), failing on any
    # missing or failed probe result. Docker on ubuntu; locally use Finch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run two-account harness
        run: COMPOSE_BIN="docker compose" harness/run.sh
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-scope-receipts
          path: harness/.receipts/receipts.jsonl
          if-no-files-found: warn
